name: Spector Auto Tests - Copilot Agent

on:
  repository_dispatch:
    types: [spector-auto-tests]
  workflow_dispatch:

permissions:
  contents: write

# Target repo for issues (workflow runs in fork, issues go to upstream)
env:
  TARGET_OWNER: Azure
  TARGET_REPO: autorest.typescript

jobs:
  trigger-copilot-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Build Copilot agent task issue
        id: build-task
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            let notImplemented = {};
            let coverageIssueNumber = null;

            const targetOwner = process.env.TARGET_OWNER;
            const targetRepo = process.env.TARGET_REPO;

            // Get data from dispatch payload or workflow inputs
            if (context.eventName === 'repository_dispatch') {
              notImplemented = context.payload.client_payload.not_implemented || {};
              coverageIssueNumber = context.payload.client_payload.issue_number;
            } else {
              // For manual trigger, fetch not-implemented scenarios from the latest coverage report issue
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: targetOwner,
                repo: targetRepo,
                labels: 'spector-coverage-report',
                state: 'open',
                sort: 'created',
                direction: 'desc',
                per_page: 10
              });

              const reportIssue = issues.find(i => i.title.startsWith('Spector Coverage Report'));

              if (reportIssue) {
                const latestIssue = reportIssue;
                coverageIssueNumber = latestIssue.number;

                // Parse scenario names from the issue body
                const lines = latestIssue.body.split(/\r?\n/);
                let currentPkg = null;
                for (const line of lines) {
                  const pkgMatch = line.match(/^### `(.+?)` \(\d+ not implemented\)/);
                  if (pkgMatch) {
                    currentPkg = pkgMatch[1];
                    notImplemented[currentPkg] = {};
                    continue;
                  }
                  if (currentPkg) {
                    // Table format: | Group | Count | Skip Implement | Scenarios |
                    const rowMatch = line.match(/^\| [`🆕 ]*`(.+?)` \| (\d+) \|[^|]*\| (.+?) \|$/);
                    if (rowMatch) {
                      // Skip groups with checked Skip Implement checkbox
                      if (/\|\s*\[x\]\s*\|/.test(line)) continue;
                      const group = rowMatch[1];
                      const scenarios = rowMatch[3].split(', ').map(s => s.trim());
                      notImplemented[currentPkg][group] = scenarios;
                    }
                  }
                }
              } else {
                coverageIssueNumber = null;
                core.warning('No open spector-coverage issue found. Create a coverage report first.');
              }
            }

            // Build the list of scenario groups for the agent prompt
            const groups = [];
            for (const [pkg, pkgGroups] of Object.entries(notImplemented)) {
              for (const [group, scenarios] of Object.entries(pkgGroups)) {
                groups.push(`- \`${group}\` (${scenarios.length} scenarios: ${scenarios.join(', ')})`);
              }
            }

            const groupList = groups.join('\n');

            if (groups.length === 0) {
              core.info('No not-implemented scenario groups found. Skipping issue creation.');
              return;
            }

            const coverageRef = coverageIssueNumber
              ? `\nResults should be commented on issue ${targetOwner}/${targetRepo}#${coverageIssueNumber}.`
              : '';

            const taskBody = [
              `## Task: Verify and Implement Spector Integration Tests`,
              ``,
              `Use the \`spector-test-implementer\` skill to verify and implement test files for the following not-implemented scenario groups.`,
              ``,
              `**Not-implemented scenario groups:**`,
              groupList,
              ``,
              `**Instructions:**`,
              `1. For each scenario group above, check if a \`.spec.ts\` file already exists in \`packages/typespec-ts/test/azureModularIntegration/\` — skip if it does`,
              `2. For remaining groups, follow the spector-test-implementer workflow to generate the client and verify the generated code is valid before writing tests`,
              `3. Read the \`.tsp\` and \`mockapi.ts\` files carefully to understand the expected behavior before implementing each test`,
              `4. Run each test and remove any failing test cases that are due to emitter limitations — only commit passing tests`,
              `5. Report which tests passed and which were removed due to failures`,
              ``,
              `**PR description format:**`,
              `The PR description must use this format for each section:`,
              ``,
              `### New spec files`,
              ``,
              `For each newly created .spec.ts file, use this structure:`,
              `- **\`Scenario_Group_Name\`** — \`scenarioGroupName.spec.ts\``,
              `  - ✅ \`scenarioName1\``,
              `  - ✅ \`scenarioName2\``,
              `  - ❌ \`scenarioName3\` (reason for failure)`,
              ``,
              `### Updated existing spec files`,
              ``,
              `Same structure as above, but for spec files that already existed and were updated with new scenarios.`,
              ``,
              `### Known skips / emitter limitations`,
              ``,
              `List any scenarios that were skipped due to emitter bugs or limitations, with the reason.`,
              coverageRef
            ].filter(Boolean).join('\n');

            // Create the task issue in the target repo
            const issue = await github.rest.issues.create({
              owner: targetOwner,
              repo: targetRepo,
              title: `[Copilot] Verify and implement spector tests for ${groups.length} scenario groups`,
              body: taskBody,
              labels: ['spector-coverage']
            });

            core.info(`Created Copilot task issue #${issue.data.number} in ${targetOwner}/${targetRepo}`);
            core.setOutput('task_issue_number', issue.data.number);

            // Assign the issue to v-jiaodi only for the Azure repo
            if (targetOwner === 'Azure') {
              await github.rest.issues.addAssignees({
                owner: targetOwner,
                repo: targetRepo,
                issue_number: issue.data.number,
                assignees: ['v-jiaodi']
              });
              core.info('Assigned issue to v-jiaodi');
            }

            // If we have a coverage issue, add a cross-reference comment
            if (coverageIssueNumber) {
              await github.rest.issues.createComment({
                owner: targetOwner,
                repo: targetRepo,
                issue_number: coverageIssueNumber,
                body: `🤖 A task issue has been created for ${groups.length} not-implemented scenario groups.\n\nTracking issue: #${issue.data.number}`
              });
            }

      # Uncomment to auto-assign Copilot coding agent to the task issue
