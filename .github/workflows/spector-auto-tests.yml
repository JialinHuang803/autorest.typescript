name: Spector Auto Tests - Copilot Agent

on:
  repository_dispatch:
    types: [spector-auto-tests]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Coverage report issue number to comment results on"
        required: false
        type: number

permissions:
  issues: write
  contents: write

jobs:
  trigger-copilot-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Build Copilot agent task issue
        id: build-task
        uses: actions/github-script@v7
        with:
          script: |
            let notImplemented = {};
            let coverageIssueNumber = null;

            // Get data from dispatch payload or workflow inputs
            if (context.eventName === 'repository_dispatch') {
              notImplemented = context.payload.client_payload.not_implemented || {};
              coverageIssueNumber = context.payload.client_payload.issue_number;
            } else {
              // For manual trigger, fetch not-implemented scenarios from the latest coverage report issue
              // Find the latest coverage report issue (title starts with "Spector Coverage Report")
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'spector-coverage-report',
                state: 'open',
                sort: 'created',
                direction: 'desc',
                per_page: 10
              });

              const reportIssue = issues.find(i => i.title.startsWith('Spector Coverage Report'));

              if (reportIssue) {
                const latestIssue = reportIssue;
                coverageIssueNumber = parseInt(process.env.INPUT_ISSUE_NUMBER) || latestIssue.number;

                // Parse scenario names from the issue body (lines matching `| \`Group_Name\` |`)
                const lines = latestIssue.body.split('\n');
                let currentPkg = null;
                for (const line of lines) {
                  const pkgMatch = line.match(/^### `(.+?)` \(\d+ not implemented\)/);
                  if (pkgMatch) {
                    currentPkg = pkgMatch[1];
                    notImplemented[currentPkg] = {};
                    continue;
                  }
                  if (currentPkg) {
                    const rowMatch = line.match(/^\| `(.+?)` \| (\d+) \| (.+?) \|$/);
                    if (rowMatch) {
                      const group = rowMatch[1];
                      const scenarios = rowMatch[3].split(', ').map(s => s.trim());
                      notImplemented[currentPkg][group] = scenarios;
                    }
                  }
                }
              } else {
                coverageIssueNumber = parseInt(process.env.INPUT_ISSUE_NUMBER) || null;
                core.warning('No open spector-coverage issue found. Create a coverage report first.');
              }
            }

            // Build the list of scenario groups for the agent prompt
            const groups = [];
            for (const [pkg, pkgGroups] of Object.entries(notImplemented)) {
              for (const [group, scenarios] of Object.entries(pkgGroups)) {
                groups.push(`- \`${group}\` (${scenarios.length} scenarios: ${scenarios.join(', ')})`);
              }
            }

            const groupList = groups.join('\n');

            if (groups.length === 0) {
              core.info('No not-implemented scenario groups found. Skipping issue creation.');
              return;
            }

            const coverageRef = coverageIssueNumber
              ? `\nResults should be commented on issue #${coverageIssueNumber}.`
              : '';

            const taskBody = [
              `## Task: Implement Spector Integration Tests`,
              ``,
              `Use the \`spector-test-implementer\` skill to implement test files for the following not-implemented scenario groups.`,
              ``,
              `**Not-implemented scenario groups:**`,
              groupList,
              ``,
              `**Instructions:**`,
              `1. For each scenario group above, check if a \`.spec.ts\` file already exists in \`packages/typespec-ts/test/azureModularIntegration/\` — skip if it does`,
              `2. For remaining groups, follow the spector-test-implementer workflow to implement the tests`,
              `3. Report which tests passed and which failed`,
              ``,
              `**PR description format:**`,
              `The PR description must use this format for each section:`,
              ``,
              `### New spec files`,
              ``,
              `For each newly created .spec.ts file, use this structure:`,
              `- **\`Scenario_Group_Name\`** — \`scenarioGroupName.spec.ts\``,
              `  - ✅ \`scenarioName1\``,
              `  - ✅ \`scenarioName2\``,
              `  - ❌ \`scenarioName3\` (reason for failure)`,
              ``,
              `### Updated existing spec files`,
              ``,
              `Same structure as above, but for spec files that already existed and were updated with new scenarios.`,
              ``,
              `### Known skips / emitter limitations`,
              ``,
              `List any scenarios that were skipped due to emitter bugs or limitations, with the reason.`,
              coverageRef
            ].filter(Boolean).join('\n');

            // Create the task issue (without assignee to avoid validation errors)
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Copilot] Implement spector tests for ${groups.length} scenario groups`,
              body: taskBody,
              labels: ['spector-coverage']
            });

            core.info(`Created Copilot task issue #${issue.data.number}`);

            // Try to assign copilot — this only works if the Copilot coding agent is enabled
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.data.number,
                assignees: ['Copilot']
              });
              core.info('Assigned issue to Copilot coding agent');
            } catch (err) {
              core.warning(`Could not assign to copilot (is the Copilot coding agent enabled?): ${err.message}`);
            }

            core.setOutput('task_issue_number', issue.data.number);

            // If we have a coverage issue, add a cross-reference comment
            if (coverageIssueNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: coverageIssueNumber,
                body: `🤖 Copilot coding agent has been triggered to implement tests for ${groups.length} not-implemented scenario groups.\n\nTracking issue: #${issue.data.number}`
              });
            }
        env:
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
