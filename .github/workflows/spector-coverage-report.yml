name: Weekly Spector Coverage Report

on:
  schedule:
    # Every Monday at 9:00 AM UTC+8 (1:00 AM UTC)
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      target_owner:
        description: "Owner of the repo to create/update the coverage issue in"
        required: false
        type: string
        default: "Azure"
      report_only:
        description: "Only update the coverage report issue, do not trigger auto-tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Target repo for issues (workflow runs in fork, issues go to upstream)
env:
  TARGET_OWNER: ${{ inputs.target_owner || 'Azure' }}
  TARGET_REPO: autorest.typescript

jobs:
  spector-coverage-report:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: Azure/autorest.typescript
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install
        timeout-minutes: 15

      - name: Build
        run: pnpm build
        timeout-minutes: 20

      - name: Copy TypeSpec specs
        working-directory: packages/typespec-ts
        run: npm run copy:typespec

      - name: Run azure-modular integration tests
        working-directory: packages/typespec-ts
        run: npm run integration-test-ci:azure-modular
        timeout-minutes: 60

      - name: Update coverage report issue
        id: update-issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const targetOwner = process.env.TARGET_OWNER;
            const targetRepo = process.env.TARGET_REPO;

            const coveragePath = path.join(
              process.env.GITHUB_WORKSPACE,
              'packages/typespec-ts/coverage/spector-coverage-typescript-modular-azure.json'
            );
            const data = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));

            // Find existing report issue by label in the target repo
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: targetOwner,
              repo: targetRepo,
              labels: 'spector-coverage-report',
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 1
            });

            // Parse previous groups, scenarios, skip-implement state, and comments from existing issue
            const previousGroups = new Set();
            const previousScenarios = {};
            const skippedGroups = new Set();
            const groupComments = {};
            if (existingIssues.length > 0) {
              const lines = existingIssues[0].body.split('\n');
              for (const line of lines) {
                const rowMatch = line.match(/^\| [`🆕 ]*`(.+?)`\s*\|\s*(\d+)\s*\|([^|]*)\|\s*(.+?)\s*\|\s*(.*?)\s*\|$/);
                if (rowMatch) {
                  const group = rowMatch[1];
                  const scenarioStr = rowMatch[4];
                  const comment = rowMatch[5].trim();
                  previousGroups.add(group);
                  previousScenarios[group] = new Set(
                    scenarioStr.split(',').map(s => s.replace(/🆕\s*/g, '').trim())
                  );
                  if (comment) {
                    groupComments[group] = comment;
                  }
                  // Check if the Skip Implement checkbox is checked (column 3)
                  if (/\[x\]/.test(rowMatch[3])) {
                    skippedGroups.add(group);
                  }
                }
              }
            }

            const today = new Date().toISOString().split('T')[0];
            let body = `# Spector Coverage Report — ${today}\n\n`;
            body += `> Auto-generated by the **Weekly Spector Coverage Report** workflow.\n\n`;

            body += `## Summary\n\n`;
            body += `| Package | Version | Total | ✅ Pass | 🔲 Not Implemented | Coverage |\n`;
            body += `|---------|---------|------:|--------:|--------------------:|---------:|\n`;

            let allNotImplemented = [];

            for (const entry of data) {
              const { packageName, version } = entry.scenariosMetadata;
              const results = entry.results;
              const scenarios = Object.entries(results);
              const total = scenarios.length;
              const pass = scenarios.filter(([, s]) => s === 'pass').length;
              const notImpl = scenarios.filter(([, s]) => s === 'not-implemented').length;
              const pct = total > 0 ? ((pass / total) * 100).toFixed(1) : '0.0';

              body += `| \`${packageName}\` | ${version} | ${total} | ${pass} | ${notImpl} | ${pct}% |\n`;

              const notImplScenarios = scenarios
                .filter(([, s]) => s === 'not-implemented')
                .map(([name]) => ({ name, package: packageName }));
              allNotImplemented.push(...notImplScenarios);
            }

            body += `\n## Not-Implemented Scenarios (${allNotImplemented.length})\n\n`;

            // Build grouped data
            const byPackage = {};
            for (const item of allNotImplemented) {
              if (!byPackage[item.package]) byPackage[item.package] = {};
              const parts = item.name.split('_');
              const group = parts.slice(0, -1).join('_');
              const scenario = parts[parts.length - 1];
              if (!byPackage[item.package][group]) byPackage[item.package][group] = [];
              byPackage[item.package][group].push(scenario);
            }

            if (allNotImplemented.length === 0) {
              body += `🎉 All scenarios are implemented!\n`;
            } else {
              for (const [pkg, groups] of Object.entries(byPackage)) {
                const totalInPkg = Object.values(groups).reduce((sum, s) => sum + s.length, 0);
                body += `### \`${pkg}\` (${totalInPkg} not implemented)\n\n`;
                body += `| Group | Count | Skip Implement | Scenarios | Comments |\n`;
                body += `|-------|------:|:--------------:|-----------|----------|\n`;
                for (const [group, scenarios] of Object.entries(groups).sort(([a], [b]) => a.localeCompare(b))) {
                  const isNewGroup = previousGroups.size > 0 && !previousGroups.has(group);
                  const label = isNewGroup ? `🆕 \`${group}\`` : `\`${group}\``;
                  const skipCheck = skippedGroups.has(group) ? '[x]' : '[ ]';
                  // Mark individual new scenarios within existing groups
                  const prevScenarios = previousScenarios[group] || new Set();
                  const scenarioLabels = scenarios.sort().map(s => {
                    if (!isNewGroup && previousGroups.size > 0 && !prevScenarios.has(s)) {
                      return `🆕 ${s}`;
                    }
                    return s;
                  });
                  const comment = groupComments[group] || '';
                  body += `| ${label} | ${scenarios.length} | ${skipCheck} | ${scenarioLabels.join(', ')} | ${comment} |\n`;
                }
                body += `\n`;
              }

              body += `---\n`;
              body += `> **📝 Skip Implement column:** Check the box \`[x]\` for any scenario group you want to exclude from automatic Copilot implementation. `;
              body += `Use this when a group has known emitter limitations, requires manual implementation, or is not yet ready for auto-generation. `;
              body += `The checkbox state is preserved across weekly report updates.\n`;
            }

            // Build not_implemented output excluding skipped groups
            const notImplementedForDispatch = {};
            for (const [pkg, groups] of Object.entries(byPackage)) {
              for (const [group, scenarios] of Object.entries(groups)) {
                if (!skippedGroups.has(group)) {
                  if (!notImplementedForDispatch[pkg]) notImplementedForDispatch[pkg] = {};
                  notImplementedForDispatch[pkg][group] = scenarios;
                }
              }
            }

            let issueNumber;
            if (existingIssues.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: targetOwner,
                repo: targetRepo,
                issue_number: existingIssues[0].number,
                body: body
              });
              issueNumber = existingIssues[0].number;
              core.info(`Updated existing issue #${issueNumber} in ${targetOwner}/${targetRepo}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: targetOwner,
                repo: targetRepo,
                title: 'Spector Coverage Report',
                body: body,
                labels: ['spector-coverage-report']
              });
              issueNumber = issue.data.number;
              core.info(`Created new issue #${issueNumber} in ${targetOwner}/${targetRepo}`);
            }

            core.setOutput('issue_number', issueNumber);
            core.setOutput('not_implemented', JSON.stringify(notImplementedForDispatch));

      - name: Trigger auto-tests workflow
        if: steps.update-issue.outputs.not_implemented != '{}' && inputs.report_only != true
        uses: actions/github-script@v7
        with:
          script: |
            const notImplemented = JSON.parse(process.env.NOT_IMPLEMENTED);
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'spector-auto-tests',
              client_payload: {
                issue_number: parseInt(process.env.ISSUE_NUMBER),
                not_implemented: notImplemented
              }
            });
        env:
          ISSUE_NUMBER: ${{ steps.update-issue.outputs.issue_number }}
          NOT_IMPLEMENTED: ${{ steps.update-issue.outputs.not_implemented }}
